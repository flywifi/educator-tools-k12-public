name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drift guard (sync_check)
        run: python3 tools/sync_check.py

      - name: Standards resolver self-test (known-good resolves; known-bad blocks)
        run: python3 tools/verify_standards.py --self-test

      - name: CPALMS verification-loop self-test (offline; mutation + disposition + census guards)
        run: python3 tools/cpalms_verify.py --self-test

      - name: Corpus parser self-test (label-vs-prose splitter probes)
        run: python3 tools/parse_fl_standards.py --self-test

      - name: Corpus is free of document furniture (parse-defect scan)
        run: python3 tools/cpalms_verify.py --scan-parse-defects

      # The overlays are the durable record the whole verification exists to produce, and until
      # this step nothing in CI ever read them. The self-test proves every check can FAIL first;
      # the audit then re-proves all confirmed labels from the stored texts, offline.
      - name: Overlay integrity self-test (mutation battery — every check must be able to fail)
        run: python3 tools/audit_overlays.py --self-test

      - name: Overlay integrity audit (re-proof, routing, id-bleed, coverage, manifest identity)
        run: python3 tools/audit_overlays.py

      - name: Sources manifest check (every referenced file exists; no duplicate records)
        run: python3 tools/standards_refresh.py --check

      - name: Currency-recheck self-test (slice/rotation/verdict probes; broken twins proven)
        run: python3 tools/currency_recheck.py --self-test

      - name: Currency-recheck selection dry run (live-tree determinism probe; fetches nothing)
        run: python3 tools/currency_recheck.py --dry-run-selection

      - name: Plugin-metadata generator self-test (pass-through, idempotency, broken twins)
        run: python3 tools/export_plugin_manifest.py --self-test

      - name: MCP tool-registry self-test (detail-strip, clamps, fabricated-code block, twins)
        run: python3 tools/mcp_tooldefs.py --self-test

      - name: MCP stdio-server self-test (frame shapes, error codes, stdout-purity twin)
        run: python3 tools/mcp_server.py --self-test

      # The Actions-schema generator and the Desktop-bundle builder both had --self-test from
      # the day they landed and neither was ever run by CI (audit M-3) — the bundle a teacher
      # one-click installs had zero standing coverage. Both are stdlib + offline.
      - name: MCP Actions-schema self-test (staged twins; both artifacts really compared)
        run: python3 tools/export_actions_schema.py --self-test

      - name: MCP Desktop-bundle self-test (stages, probes real stdio, manifest shape twins)
        run: python3 tools/build_mcpb.py --self-test

      - name: Cross-platform lint (bare-interpreter spawns; encoding-less text opens)
        run: python3 tools/mac_audit.py

      - name: Validate eval files
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob("skills/**/evals/evals.json", recursive=True):
              try:
                  json.load(open(f))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all eval files valid")
          PY

      - name: Package all skills (validates every skill is installable)
        run: python3 tools/package_skill.py --all

      - name: Skill-health gate (block on any blocking issue)
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          rep = json.loads(subprocess.check_output(["python3", "shared/health/health.py", "--scan"]))
          print(f"readiness {rep['readiness_score']}/100 ({rep['readiness_band']}); "
                f"blocking={len(rep['blocking_issues'])}")
          if rep["blocking_issues"]:
              print("\n".join(rep["blocking_issues"])); sys.exit(1)
          PY

      - name: Version-registry self-test (drift/missing/malformed probes, each proven failable)
        run: python3 tools/version.py --self-test

      - name: Version consistency (versions.json == VERSION == plugin == marketplace; skills match)
        run: python3 tools/version.py --check

      - name: Validate committed example artifacts (output-validator)
        run: python3 tools/validate_examples.py

      - name: Registry currency (informational drift report)
        run: python3 tools/registry_currency.py --summary || true

      # LAST in the job on purpose: an SDK install failure must never mask a stdlib failure.
      - name: MCP hosted-leg self-test (installs the SDK; in-memory Client round-trip)
        run: |
          pip install -r tools/requirements-mcp.txt
          python3 tools/mcp_http_server.py --self-test

      - name: Repair loop (advisory — detect, propose, verify)
        run: python3 tools/repair_loop.py || true
      # Phase A+: add eval smoke tests here (skill triggering + Quality Gates pass).

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install pip-audit bandit semgrep
      - name: Dependency + code security scan (gate)
        run: python3 tools/security_scan.py
